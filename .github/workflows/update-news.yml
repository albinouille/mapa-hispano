name: Actualizar noticias

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-news
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Récupérer les actualités
        run: python scripts/fetch_news.py

      - name: Enregistrer news.json s'il a changé
        run: |
          git config user.name "news-bot"
          git config user.email "news-bot@users.noreply.github.com"
          git add news.json
          if git diff --cached --quiet; then
            echo "Rien à enregistrer"
          else
            git commit -m "chore: actualización de noticias"
            git push
          fi
